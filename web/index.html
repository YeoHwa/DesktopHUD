<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Desktop HUD</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="left">
    <!-- 상태 패널 -->
    <div class="pn" id="status">
      <div class="clock-row">
        <span id="clock" class="pywebview-drag-region" title="끌어서 HUD 위치 옮기기">--:--</span>
        <span><span id="date"></span><button class="gear" id="gear" aria-label="HUD 메뉴"><i class="g">&#xE713;</i></button></span>
      </div>
      <div id="gearmenu" hidden>
        <button data-g="settings">설정</button>
        <button data-g="theme" id="themebtn">어두운 테마로 바꾸기</button>
        <hr>
        <button data-g="rescan">게임 목록 새로고침</button>
        <button data-g="toast">알림 테스트</button>
        <button data-g="reload">HUD 새로고침</button>
        <button data-g="quit">HUD 종료</button>
      </div>
      <div class="dev-row">
        <button id="mouse" title="마우스 프로그램 열기 (G HUB / Razer Synapse)">
          <span class="mouse-top"><i class="g">&#xE962;</i><span class="label" id="mname">마우스</span><i class="g" id="chg" hidden>&#xE945;</i><b id="bat">--%</b></span>
          <span class="mouse-top"><span class="bar" id="batbar"><i style="width:0"></i></span><span class="label" id="bath"></span></span>
        </button>
        <button id="kb" title="키보드 설정 열기"><i class="g" style="font-size:20px">&#xE765;</i><i class="g" style="font-size:10px;color:var(--mut)">&#xE8A7;</i></button>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div class="seg" id="snd"></div>
        <div class="seg" id="mod">
          <button data-v="Game"><i class="g">&#xE7FC;</i>게임 모드</button>
          <button data-v="Dev"><i class="g">&#xE943;</i>개발 모드</button>
        </div>
      </div>
      <div class="stats">
        <div>CPU <b id="cpu">-</b><div class="bar" id="cpub"><i style="width:0"></i></div></div>
        <div>GPU <b id="gpu">-</b><div class="bar" id="gpub"><i style="width:0"></i></div></div>
        <div>RAM <b id="ram">-</b><div class="bar" id="ramb"><i style="width:0"></i></div></div>
      </div>
    </div>

    <!-- 메뉴 -->
    <div class="pn" id="menu">
      <button class="mi" data-k="game"><i class="g">&#xE7FC;</i>게임<span class="cnt" id="gcnt"></span><i class="g cv">&#xE76C;</i></button>
      <button class="mi" data-k="live"><i class="g">&#xE93E;</i>치지직 라이브<span class="lv" id="livecnt" hidden></span><i class="g cv">&#xE76C;</i></button>
      <button class="mi" data-k="msg"><i class="g">&#xE8BD;</i>메신저·커뮤니티<i class="g cv">&#xE76C;</i></button>
      <button class="mi" data-k="file"><i class="g">&#xE8B7;</i>내 파일<i class="g cv">&#xE76C;</i></button>
      <button class="mi" data-k="dev"><i class="g">&#xE943;</i>개발 유틸리티<i class="g cv">&#xE76C;</i></button>
      <button class="mi" data-k="sys"><i class="g">&#xE9E9;</i>시스템<i class="g cv">&#xE76C;</i></button>
      <button class="mi" data-k="web"><i class="g">&#xE909;</i>웹 바로가기<i class="g cv">&#xE76C;</i></button>
    </div>

    <!-- 음악 -->
    <div class="pn" id="player">
      <div class="pl-head"><span class="label" id="plabel">지금 재생 중</span>
        <button id="yt" title="YouTube Music 열기"><i class="g">&#xE8D6;</i>YouTube Music</button></div>
      <div class="track">
        <div id="art"><i class="g">&#xE8D6;</i></div>
        <div class="track-text"><div id="title">재생 중인 곡이 없어요</div><div id="artist">YouTube Music을 열어 보세요</div></div>
      </div>
      <div class="prog"><span id="cur">0:00</span><span class="bar" id="progbar"><i style="width:0"></i></span><span id="dur">0:00</span></div>
      <div class="ctrl">
        <button class="cb" data-m="prev" aria-label="이전 곡"><i class="g">&#xE892;</i></button>
        <button class="cb" data-m="rewind" aria-label="10초 되감기" title="10초 되감기"><i class="g">&#xEB9E;</i></button>
        <button class="cb" id="pp" data-m="toggle" aria-label="재생/일시정지"><i class="g">&#xE768;</i></button>
        <button class="cb" data-m="forward" aria-label="10초 앞으로" title="10초 앞으로"><i class="g">&#xEB9D;</i></button>
        <button class="cb" data-m="next" aria-label="다음 곡"><i class="g">&#xE893;</i></button>
      </div>
      <div class="vol">
        <button class="cb" id="volbtn" aria-label="음소거" style="width:26px;height:26px"><i class="g">&#xE767;</i></button>
        <input type="range" min="0" max="100" step="1" value="0" id="vol" aria-label="PC 음량">
        <span id="volv">-</span>
      </div>
    </div>
  </div>

  <!-- 오른쪽 패널 -->
  <div class="pn" id="right" hidden>
    <div class="r-head">
      <span id="rt"></span><span id="rs"></span>
      <div class="r-tools">
        <button class="icon-btn" id="rrefresh" aria-label="새로고침"><i class="g">&#xE72C;</i></button>
        <button class="icon-btn" id="rclose" aria-label="패널 닫기"><i class="g">&#xE711;</i></button>
      </div>
    </div>
    <div id="chips"></div>
    <div id="body"></div>
  </div>
</div>
<div id="confirm" hidden><span id="cmsg"></span><button class="btn" id="cyes">확인</button><button class="btn ghost" id="cno">취소</button></div>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
